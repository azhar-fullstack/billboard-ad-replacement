<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Image Coloring Editor</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="left">
        <button id="prevBtn">Prev (A)</button>
        <button id="nextBtn">Next (D)</button>
        <button id="saveBtn">Save (S)</button>
      </div>
      <div class="center">
        <span id="fileInfo">Loading...</span>
      </div>
      <div class="right">
        <button id="paintBtn" class="active">Paint Red (R)</button>
        <button id="eraseBtn">Erase (E)</button>
        <button id="polygonBtn">Polygon Pins (P)</button>
        <button id="applyPolygonBtn">Fill Polygon (F)</button>
        <button id="clearPinsBtn">Clear Pins (X)</button>
        <label>Brush
          <input id="brushSize" type="range" min="2" max="120" value="20" />
        </label>
        <span id="brushValue">20</span>
      </div>
    </header>

    <main class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </main>

    <footer class="help">
      <span>Shortcuts: R paint, E erase, P polygon mode, F fill polygon, X clear pins, S save, A previous, D next, [ ] brush size</span>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
